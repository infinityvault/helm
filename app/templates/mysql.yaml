{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mysql.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mysql.name }}
spec:
  serviceName: {{ .Values.mysql.name }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if not (and .Values.scaleToZero.enabled .Values.scaleToZero.dataStores.enabled) }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.mysql.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.mysql.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}
          ports:
            - name: mysql
              containerPort: 3306
          {{- /* `ping` exits 0 whenever the server answers, even with "Access denied" - no credentials needed. mariadb-admin first: MariaDB images may no longer ship the mysqladmin name, MySQL images only have that. */}}
          {{- include "app.dataStoreProbes" (dict "command" "if command -v mariadb-admin >/dev/null 2>&1; then mariadb-admin ping -h 127.0.0.1 --protocol=tcp --silent; else mysqladmin ping -h 127.0.0.1 --protocol=tcp --silent; fi") | nindent 10 }}
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database.name | quote }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.database.credentialsSecretName | quote }}
                  key: DATABASE_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.database.credentialsSecretName | quote }}
                  key: DATABASE_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.database.credentialsSecretName | quote }}
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.volumeSize | quote }}
{{- end }}
