{{- if and .Values.traefikIngress.enabled .Values.traefikIngress.domain }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.traefikIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.traefikIngress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.traefikIngress.domain }}`)
      kind: Rule
      services:
        {{- if .Values.scaleToZero.enabled }}
        # Through the KEDA HTTP add-on's interceptor, which routes on the
        # Host header (see scale-to-zero.yaml) - needs Traefik's
        # allowCrossNamespace, since it lives in the add-on's namespace.
        - name: {{ .Values.scaleToZero.interceptor.service }}
          namespace: {{ .Values.scaleToZero.interceptor.namespace }}
          port: {{ .Values.scaleToZero.interceptor.port }}
        {{- else }}
        - name: {{ include "app.name" . }}
          port: {{ .Values.service.port }}
        {{- end }}
  {{- with .Values.traefikIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
