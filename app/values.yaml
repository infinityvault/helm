# Old revisions kept per workload (the app Deployment/StatefulSet and the
# postgres/mysql/redis StatefulSets): ReplicaSets for a Deployment,
# ControllerRevisions for a StatefulSet. 0 keeps only the current one -
# rollbacks go through ArgoCD (redeploy an earlier revision of the values),
# not `kubectl rollout undo`.
revisionHistoryLimit: 0

app:
  name: "example"
  containerPort: 80
  imagePullPolicy: IfNotPresent
  labels: {}
  podAnnotations: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []

persistence:
  enabled: true
  volumeName: data
  mountPath: /data/db
  # Mounted as a subPath of the volume (not its root) so the app's own
  # files never collide with what restic-backup keeps alongside it in the
  # same volume (e.g. the Postgres dump file) - see dataProtection, which
  # always mounts the whole volume unsplit at /data.
  subPath: data
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  existingClaim: ""
  claimName: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}

waitFor:
  image: "busybox:1.36"
  imagePullPolicy: IfNotPresent
  ports:
    postgres: 5432
    mysql: 3306
    redis: 6379

statefulSet:
  enabled: false
  replicas: 1
  image: "nginx"
  # imagePullPolicy: IfNotPresent
  # waitFor: ["postgres", "mysql", "redis"]
  # command: []
  # args: []
  # env:
  #   - name: "MY_VAR"
  #     value: "my_value"
  #   - name: "ANOTHER_VAR"
  #     valueFrom:
  #       secretKeyRef:
  #         name: "my-secret"
  #         key: "ANOTHERVAR"
  # envFrom: []
  # volumeClaimTemplates:
  #   - metadata:
  #       name: data
  #     spec:
  #       accessModes: ["ReadWriteOnce"]
  #       resources:
  #         requests:
  #           storage: 5Gi

deployment:
  enabled: true
  replicas: 1
  image: "nginx"
  # imagePullPolicy: IfNotPresent
  # waitFor: ["postgres", "mysql", "redis"]
  # command: []
  # args: []
  # env:
  #   - name: "MY_VAR"
  #     value: "my_value"
  #   - name: "ANOTHER_VAR"
  #     valueFrom:
  #       secretKeyRef:
  #         name: "my-secret"
  #         key: "ANOTHERVAR"
  # envFrom: []

postgres:
  enabled: false
  name: "postgres"
  image: "postgres:16"
  volumeSize: "5Gi"
  database:
    name: "example"
    credentialsSecretName: "example"
    # Secret schema:
    # DATABASE_USERNAME
    # DATABASE_PASSWORD

mysql:
  enabled: false
  name: "mysql"
  image: "mysql:8"
  volumeSize: "5Gi"
  database:
    name: "example"
    credentialsSecretName: "example"
    # Secret schema:
    # DATABASE_USERNAME
    # DATABASE_PASSWORD

redis:
  enabled: false
  name: "redis"
  image: "redis:7"
  volumeSize: "1Gi"

traefikIngress:
  enabled: true
  # domain: "example.com"
  entryPoints:
    - websecure
  annotations: {}
  tls: {}

# Scale the app workload to zero when idle, and back up on the next request,
# via the KEDA HTTP add-on (http.keda.sh/v1beta1 InterceptorRoute + a
# keda.sh/v1alpha1 ScaledObject). Requires KEDA and the HTTP add-on in the
# cluster, and Traefik with providers.kubernetesCRD.allowCrossNamespace:
# while enabled, the IngressRoute sends traffic to the add-on's interceptor
# (which holds requests during a cold start and counts them for scaling)
# instead of straight to the app Service. postgres/mysql/redis are stopped
# too while nothing uses them (see dataStores).
scaleToZero:
  enabled: false
  # Seconds without requests before the workload is scaled down to zero
  # (the ScaledObject's cooldownPeriod).
  idleTimeout: 300
  maxReplicas: 1
  # In-flight requests per replica the add-on scales up on.
  targetConcurrency: 100
  # Where the HTTP add-on runs - defaults match its upstream chart installed
  # as release "keda-add-ons-http" in namespace "infra-keda".
  interceptor:
    namespace: infra-keda
    service: keda-add-ons-http-interceptor-proxy
    port: 8080
  scalerAddress: keda-add-ons-http-external-scaler.infra-keda:9090
  # Each enabled data store (postgres/mysql/redis) gets its own ScaledObject
  # that runs it exactly while an app pod exists - and, for postgres/mysql,
  # while a backup/debug job pod exists, so backups keep working while the
  # app is asleep (those jobs wait for the database before starting).
  dataStores:
    enabled: true
    # Seconds after the last such pod is gone before the data store stops.
    cooldownPeriod: 60
    # How often KEDA checks for those pods - bounds the extra delay a cold
    # start spends waiting for the data store.
    pollingInterval: 5

dataProtection:
  enabled: false
  image: "ghcr.io/infinityvault/restic-backup:0.1.5"
  imagePullPolicy: IfNotPresent
  # repositorySecretName should contain all restic-backup environment variables
  # such as RESTIC_REPOSITORY and RESTIC_PASSWORD.
  repositorySecretName: ""
  env: []
  envFrom: []
  # Leave empty to mount persistence.volumeName at /data - restic-backup's
  # own default data directory, so RESTIC_BACKUP_DATA_DIR never needs to be
  # set. Only set this to mount somewhere else instead.
  volumeMounts: []
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  backup:
    enabled: true
    schedule: "0 2 * * *"
    notifications:
      enabled: true
      mode: "on_failure"

  restore:
    enabled: true
    checkPath: "/data"
    # beforeTimestamp: "2024-01-01"
    notifications:
      enabled: true
      mode: "always"

  cleanup:
    enabled: true
    schedule: "0 3 * * *"
    keepDaily: 7
    keepWeekly: 4
    # keepHourly: 24
    # keepMonthly: 6
    # keepYearly: 2
    notifications:
      enabled: true
      mode: "on_failure"

  # A CronJob that's never scheduled (suspended) - it exists only as a
  # template for `kubectl create job --from=cronjob/<release>-debug` to
  # get an on-demand shell with the same image/env/mounts as
  # backup/restore/cleanup, for poking at the restic repository by hand.
  debug:
    enabled: true
